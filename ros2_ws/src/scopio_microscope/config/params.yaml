# SCOPIO node parameters. Loaded by microscope.launch.py.
# Topic/namespace: everything lives under /scopio.
#
# The backend does NO image analysis: it senses, streams and effectuates.
# Bead detection/tracking is a CLIENT concern, done off the Pi on the recorded
# or streamed footage (see viscosity/ and viscosity_agent/).

/scopio/camera_node:
  ros__parameters:
    width: 640
    height: 480
    framerate: 30.0          # capture fps (drives exposure/gain budget)
    publish_fps: 15.0        # rate of the compressed image topic
    jpeg_quality: 70
    # NOTE: the camera node no longer records. Recording is a client concern
    # (the UI saves the subscribed stream to its own local folder).

/scopio/stage_node:
  ros__parameters:
    publish_rate: 5.0        # Hz, StagePosition
    step_x: 40               # default jog/grid step (steps)
    step_y: 40
    step_z: 40

/scopio/galvo_node:
  ros__parameters:
    # VISA resource of the AWG (the DG1022Z). SET THIS IN ros2_ws/.env as
    # GALVO_RESOURCE, which wins over this -- that file is the one place the rig
    # is described. Find the string with scripts/list_instruments.py.
    # Unset => the node runs and reports connected=false with a log line saying
    # so. It does NOT guess: picking "the first USB instrument" is how the AWG
    # ended up opening the temperature controller and dropping its readings.
    resource: ""
    auto_discover: false     # true => fall back to the first RIGOL-vendor USB device
    init_on_connect: true    # on connect, put both channels in DC mode + outputs ON (dcinit),
                             # so a client's update(ch,val) moves the galvo right away. false => leave as-is.
    publish_rate: 5.0        # Hz, AwgStatus
    reconnect_period: 15.0   # s between reconnect attempts while offline
    # VISA read/write timeout. Bumped from 5000: a large arbitrary-waveform
    # ":DATA VOLATILE" upload can take a few seconds for the DG1022Z to ingest
    # over USB-TMC, and 5 s was too tight (clients saw "[Errno 110] timed out").
    # Clients must also request a matching gateway timeout for the big uploads
    # (galvo_draw does). Takes effect on container restart.
    timeout_ms: 15000

/scopio/temperature_node:
  ros__parameters:
    # Address of the TC10 LAB. SET THIS IN ros2_ws/.env as TCLAB_RESOURCE, which
    # wins over this. Find the string with scripts/list_instruments.py.
    # Unset => the node runs, reports connected=false and says so loudly. It
    # does NOT guess which USB device is the controller.
    # Two forms work: a VISA string ("USB0::6725::12545::<serial>::0::INSTR",
    # or "TCPIP::<ip>::INSTR" for an Ethernet unit -- which can never be
    # discovered, pyvisa-py does not scan the LAN), or the kernel usbtmc char
    # device ("/dev/usbtmc0"). Whichever gets there first wins on this Pi:
    # opening it over VISA detaches the kernel driver and the char device
    # disappears, so do not expect both to be available at once.
    resource: ""
    auto_discover: false     # true => look for a WAVELENGTH-vendor device / /dev/usbtmc*
    units: "C"               # forced on connect, so published degrees are unambiguous
                             # ("" => leave the instrument's current units alone)
    publish_rate: 1.0        # Hz, TemperatureStatus (this node POLLS, unlike galvo_node)
    reconnect_period: 10.0   # s between reconnect attempts while offline
    timeout_ms: 5000

/scopio/calibration_node:
  ros__parameters:
    # Persisted spatial calibration (survives restarts). Relative paths are
    # resolved against the process working directory.
    calibration_file: "calibration.json"
