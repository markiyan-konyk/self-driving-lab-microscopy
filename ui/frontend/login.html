<!DOCTYPE html>
<html lang="en">
<head>
    <title>SCOPIO — MatterLab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #0c1311;
            --bg-2: #101a17;
            --panel: #121d19;
            --line: #24332c;
            --text: #eaf2ee;
            --muted: #8fa69b;
            --green: #34d399;
            --green-bright: #6ee7b7;
            --green-deep: #10b981;
            color-scheme: dark;
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 22px;
            color: var(--text); background: var(--bg);
            position: relative; overflow: hidden;
        }
        /* Subtle grey-green lab background: layered radial glows that drift slowly. */
        .bg-fx {
            position: fixed; inset: -20%; z-index: 0; pointer-events: none;
            background:
                radial-gradient(38% 38% at 22% 28%, rgba(52,211,153,.10), transparent 70%),
                radial-gradient(42% 42% at 80% 24%, rgba(110,231,183,.07), transparent 70%),
                radial-gradient(50% 50% at 70% 82%, rgba(16,185,129,.08), transparent 70%),
                linear-gradient(160deg, #0c1311 0%, #0e1714 50%, #0b100e 100%);
            animation: drift 22s ease-in-out infinite alternate;
        }
        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .35;
            background-image:
                linear-gradient(rgba(52,211,153,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52,211,153,.045) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(circle at 50% 45%, #000 35%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 35%, transparent 80%);
        }
        @keyframes drift {
            0%   { transform: translate3d(0,0,0) scale(1); }
            100% { transform: translate3d(-2%, -2%, 0) scale(1.06); }
        }

        .card {
            position: relative; z-index: 1;
            width: min(100%, 400px);
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            padding: 34px 30px 30px;
            border: 1px solid var(--line); border-radius: 18px;
            background: linear-gradient(180deg, rgba(18,29,25,.92), rgba(12,19,17,.92));
            box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);
            backdrop-filter: blur(6px);
            animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        .ml-logo { width: 92px; height: 92px; filter: drop-shadow(0 6px 18px rgba(52,211,153,.25)); }
        .lg-dot { opacity: 0; transform-box: fill-box; transform-origin: center;
                  animation: dotpop .55s cubic-bezier(.2,.9,.3,1.4) forwards; }
        @keyframes dotpop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
        .brand { text-align: center; }
        .brand .scopio {
            margin: 0; font-size: 34px; font-weight: 800; letter-spacing: 6px;
            background: linear-gradient(90deg, var(--green-bright), var(--green));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .brand .tagline { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; letter-spacing: 2px; text-transform: uppercase; }

        form { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
        label { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
        input {
            width: 100%; min-height: 48px;
            border: 1px solid var(--line); border-radius: 11px;
            background: #0b1310; color: var(--text);
            font: inherit; font-size: 17px; padding: 10px 13px; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(52,211,153,.16); }
        button {
            min-height: 48px; border: none; border-radius: 11px;
            background: linear-gradient(90deg, var(--green-deep), var(--green));
            color: #07140f; font: inherit; font-weight: 800; letter-spacing: .5px;
            cursor: pointer; transition: filter .15s, transform .04s;
        }
        button:hover { filter: brightness(1.08); }
        button:active { transform: translateY(1px); }
        .error { min-height: 18px; margin: 2px 0 0; text-align: center; color: #fca5a5; font-size: 13px; }
        .lab { margin-top: 6px; color: var(--muted); font-size: 11px; letter-spacing: .5px; opacity: .8; }
    </style>
</head>
<body>
    <div class="bg-fx"></div>
    <div class="bg-grid"></div>

    <div class="card">
        __LOGO__
        <div class="brand">
            <h1 class="scopio">SCOPIO</h1>
            <p class="tagline">MatterLab Automated Microscope</p>
        </div>
        <form method="post" action="/login">
            <label>Password
                <input name="password" type="password" autocomplete="current-password" autofocus required>
            </label>
            <button type="submit">Unlock</button>
            <p class="error">{{ error }}</p>
        </form>
        <p class="lab">University of Toronto · The Matter Lab</p>
    </div>
</body>
</html>
