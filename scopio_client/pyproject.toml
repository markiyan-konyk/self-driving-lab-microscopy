[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scopio-client"
version = "0.1.0"
description = "Python SDK for the SCOPIO microscope API gateway (HTTP/WebSocket, API-key auth)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Konyk", email = "mark.konyk@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "websocket-client>=1.5",
]

[tool.setuptools.packages.find]
include = ["scopio_client*"]
